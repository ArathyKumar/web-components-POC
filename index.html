<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Components POC</title>

    <link
      rel="stylesheet"
      href="node_modules/@patternfly/patternfly/patternfly.css"
    />
    <link rel="stylesheet" href="styles/global/theme.css" />
    <link rel="stylesheet" href="styles/global/site.css" />
  </head>
  <body class="site-home">
    <main class="site-main site-main--home">
      <header class="site-header site-header--home">
        <p class="site-header__eyebrow">PatternFly · Lit</p>
        <h1 class="site-header__title pf-v6-c-title pf-m-3xl">Web Components POC</h1>
        <p class="site-header__subtitle">

      <section class="catalog" aria-labelledby="catalog-heading">

        <ul class="catalog-grid" data-catalog-grid aria-label="Component catalog"></ul>
      </section>
    </main>

    <script type="module">
      import { renderComponentCatalog } from './scripts/render-catalog.js';

      renderComponentCatalog();
    </script>
